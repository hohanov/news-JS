<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />
        <title>NewsPortal</title>
    </head>
    <body>
        <header>
            <h1>News Portal</h1>
        </header>
        <main>
            <div class="sources buttons"></div>
            <div class="news"></div>
        </main>
        <footer>
            <p>
                <span>©
                    <script>
                        document.write(new Date().getFullYear());
                    </script>
                     · Aleksandr Khokhanov ·
                </span>

                <a href="https://github.com/hohanov/" class="logo_gh" target="_blank"><img src="GitHub_Invertocat_White.svg" alt="Github" width="20"></a>
            </p>

            <a href="https://rs.school/courses/javascript" target="_blank"><img class="logo_rs" src="https://raw.githubusercontent.com/rolling-scopes-school/tasks/60930096a399442cbcc12500d33e4fa8e820440f/fullstack-engineering/tasks/cv/assets/rs-school-logo.svg" alt="The Rolling Scopes School" width="54"></a>
        </footer>

        <template id="sourceItemTemp">
            <div class="source__item">
                <span class="source__item-name"></span>
            </div>
        </template>

        <template id="newsItemTemp">
            <div class="news__item">
                <div class="news__meta">
                    <div class="news__meta-photo"></div>
                    <ul class="news__meta-details">
                        <li class="news__meta-author"></li>
                        <li class="news__meta-date"></li>
                    </ul>
                </div>
                <div class="news__description">
                    <h2 class="news__description-title"></h2>
                    <h3 class="news__description-source"></h3>
                    <p class="news__description-content"></p>
                    <p class="news__read-more">
                        <a href="#">Read More</a>
                    </p>
                </div>
            </div>
        </template>
    </body>
</html>
